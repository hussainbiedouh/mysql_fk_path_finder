[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    -ra
    --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests requiring real MySQL connection
    unit: marks tests as unit tests (default)
    cli: marks CLI-related tests
    database: marks database-related tests
    graph: marks graph-related tests
    finder: marks finder-related tests
filterwarnings =
    ignore::DeprecationWarning:mysql.connector.*:
    ignore::UserWarning
console_output_style = progress
required_plugins = pytest-cov pytest-mock
